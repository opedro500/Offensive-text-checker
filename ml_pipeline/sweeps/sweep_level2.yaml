program: ml_pipeline/train_level2.py
method: bayes
metric:
  name: val_accuracy
  goal: maximize
parameters:
  vocab_size:
    values: [5000, 10000]
  embedding_dim:
    values: [32, 64, 128]
  gru_units:
    values: [32, 64, 128]
  learning_rate:
    values: [0.001, 0.0001]
  batch_size:
    values: [16, 32, 64]
  dropout_rate:
    values: [0.3, 0.4, 0.5]