<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Verificador de Comentário Ofensivo</title>
</head>

<body>
    <div id="container">
        <form action="" id="send" autocomplete="off">
            <i class="fa-regular fa-comment-dots"></i>
            <input type="search" name="verify_text" id="verify_text" placeholder="Digite um comentário">
            <button type="submit" title="Enviar">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

        <div id="ai_selector_container">
            <button type="button" id="toggle_model_btn" title="Modelos de IA">
                <i class="fa-solid fa-brain"></i>
            </button>
            
            <div id="select_wrapper">
                <select id="model_level">
                    <option value="1">Nível 1: TF-IDF</option>
                    <option value="2">Nível 2: GRU</option>
                    <option value="3" selected>Nível 3: BERTimbau</option>
                </select>
            </div>
        </div>

        <div id="custom_loader_box">
            <div id="custom_loader"></div>
        </div>

        <div id="good_result_test">
            <i class="fa-regular fa-face-smile" id="good_face"></i>
            <span>Comentário legal!</span>
        </div>

        <div id="bad_result_test">
            <i class="fa-regular fa-face-frown" id="bad_face"></i>
            <span>Comentário ruim!</span>
        </div>

        <div id="error_comment">Digite um comentário...</div>
    </div>

    <script src="javascript/script.js"></script>
</body>

</html>
